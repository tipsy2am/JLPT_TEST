<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N1 言語知識 練習問題</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic Pro","Meiryo","Microsoft JhengHei",sans-serif;background:#f0f4f8;color:#333;line-height:1.7}
header{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;text-align:center;padding:28px 20px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
header h1{font-size:1.9rem;letter-spacing:2px}
header p{margin-top:6px;font-size:.95rem;opacity:.85}
main{max-width:860px;margin:28px auto;padding:0 14px 60px}

.selector-wrap{background:#fff;border-radius:14px;padding:22px 26px;margin-bottom:26px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.selector-wrap label{font-size:.85rem;color:#555;display:block;margin-bottom:8px;font-weight:bold}
select{width:100%;padding:12px 16px;font-size:1.05rem;border:2px solid #c5cae9;border-radius:10px;background:#fff;color:#333;cursor:pointer;font-family:inherit;outline:none;transition:border-color .2s}
select:focus{border-color:#3949ab}

.section-info{background:#e8eaf6;border-radius:10px;padding:12px 18px;margin-bottom:20px;font-size:.9rem;color:#3949ab;display:flex;align-items:center;gap:8px}

.q-block{background:#fff;border-radius:14px;padding:22px 24px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:box-shadow .2s}
.q-block:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}

.q-num{display:inline-block;background:#e8eaf6;color:#1a237e;font-weight:bold;padding:2px 10px;border-radius:6px;font-size:.83rem;margin-bottom:10px}
.q-text{font-size:1.03rem;margin-bottom:14px;line-height:1.85}
.underline{text-decoration:underline;text-underline-offset:3px}
.blank{color:#1a237e;font-weight:bold}
.passage-box{background:#fafafa;border-left:4px solid #90caf9;padding:14px 18px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:.97rem;line-height:2}

.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:580px){.options{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:9px;padding:9px 13px;border:2px solid #e0e0e0;border-radius:9px;cursor:pointer;transition:all .15s;font-size:.95rem;user-select:none}
.opt:hover{border-color:#5c6bc0;background:#f3f4ff}
.opt input{display:none}
.opt.sel{border-color:#1a237e;background:#e8eaf6}
.opt.ok{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32;font-weight:bold}
.opt.ng{border-color:#c62828;background:#ffebee;color:#c62828}
.opt-lbl{width:24px;height:24px;background:#e0e0e0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.8rem;flex-shrink:0;transition:background .15s}
.opt.sel .opt-lbl{background:#1a237e;color:#fff}
.opt.ok  .opt-lbl{background:#2e7d32;color:#fff}
.opt.ng  .opt-lbl{background:#c62828;color:#fff}

.check-btn{display:none;margin-top:13px;padding:9px 22px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border:none;border-radius:8px;font-size:.93rem;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .2s}
.check-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,35,126,.3)}
.check-btn:disabled{opacity:.5;cursor:default;transform:none}

.result-box{display:none;margin-top:13px;padding:13px 16px;border-radius:9px;font-size:.9rem;line-height:1.75}
.result-box.correct-res{background:#e8f5e9;border-left:4px solid #2e7d32}
.result-box.wrong-res{background:#fff3e0;border-left:4px solid #f57c00}
.result-icon{font-size:1.1rem;font-weight:bold;margin-bottom:4px}
.exp-text{color:#555;margin-top:6px}

.score-bar{background:#fff;border-radius:12px;padding:14px 22px;margin-bottom:22px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);flex-wrap:wrap}
.score-stat{text-align:center;min-width:60px}
.score-stat .num{font-size:1.4rem;font-weight:bold;color:#1a237e}
.score-stat .lbl{font-size:.75rem;color:#777}
.prog-wrap{flex:1;min-width:120px}
.prog-bg{background:#e0e0e0;border-radius:8px;height:9px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,#1a237e,#42a5f5);height:100%;border-radius:8px;transition:width .3s}
.prog-lbl{font-size:.8rem;color:#666;margin-bottom:4px}

.empty-state{text-align:center;padding:60px 20px;color:#999;font-size:1rem}
</style>
</head>
<body>

<header>
  <h1>🎌 JLPT N1 言語知識 練習問題</h1>
  <p>文字・語彙 ／ 文法　― 選択後すぐに答え合わせができます</p>
</header>

<main>

  <div class="selector-wrap">
    <label>📚 問題の種類を選択してください</label>
    <select id="sectionSelect" onchange="loadSection()">
      <option value="">― 選択してください ―</option>
      <option value="kanji">問題１　漢字の読み方（50問）</option>
      <option value="vocab">問題２　文脈規定・語彙（50問）</option>
      <option value="synonym">問題３　言い換え類義（50問）</option>
      <option value="usage">問題４　用法（50問）</option>
      <option value="grammar">問題５　文の文法（50問）</option>
    </select>
  </div>

  <div class="score-bar" id="scoreBar" style="display:none">
    <div class="score-stat"><div class="num" id="scCorrect">0</div><div class="lbl">正解</div></div>
    <div class="score-stat"><div class="num" id="scWrong">0</div><div class="lbl">不正解</div></div>
    <div class="score-stat"><div class="num" id="scPct">—</div><div class="lbl">正答率</div></div>
    <div class="prog-wrap">
      <div class="prog-lbl" id="progLbl">0 問 回答済み</div>
      <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="questionArea"><div class="empty-state">上のメニューから問題を選んでください</div></div>

</main>

<script>
// ─────────────────────────────────────────────
// 問題データ
// ─────────────────────────────────────────────
const DATA = {

// ════════════════════════════════════════════
// 問題１　漢字の読み方
// ════════════════════════════════════════════
kanji: {
  name:"問題１　漢字の読み方",
  desc:"＿＿の言葉の読み方として最もよいものを１〜４から選んでください。",
  questions:[
    {t:"彼女の<u>憂鬱</u>な表情から、深刻な問題を抱えていることがうかがえた。",o:["きつい","ゆううつ","むなしい","おとなしい"],a:1,e:"「憂鬱（ゆううつ）」は気分が晴れず暗い状態。「鬱」は画数が多い難読字の代表です。"},
    {t:"社長は部下の<u>功績</u>を称え、盛大な表彰式を開いた。",o:["こうさく","こうとく","こうせき","こうしき"],a:2,e:"「功績（こうせき）」は優れた業績・手柄のことです。"},
    {t:"長年の<u>確執</u>が続いていた両国は、ついに和解の道を選んだ。",o:["かくしつ","かくせつ","こうしつ","こくしつ"],a:0,e:"「確執（かくしつ）」は意見・立場の対立が続き、互いに譲らない状態です。"},
    {t:"新薬の開発においては<u>綿密</u>な臨床試験が不可欠だ。",o:["けんみつ","きんみつ","めんみつ","めんさく"],a:2,e:"「綿密（めんみつ）」は細部まで注意が行き届いている様子です。"},
    {t:"その映画監督は<u>斬新</u>な映像表現で世界中の観客を魅了した。",o:["しんしん","ざんしん","さんしん","せんしん"],a:1,e:"「斬新（ざんしん）」はこれまでにない新しい発想・形式のことです。"},
    {t:"この問題を<u>看過</u>することはできない。",o:["かんか","みか","かんくわ","みすごし"],a:0,e:"「看過（かんか）」は見逃すこと。「看過できない」＝見過ごせない、という意味です。"},
    {t:"彼は<u>逡巡</u>した末、断ることにした。",o:["しゅんじゅん","せんじゅん","しゅうじゅん","じゅんじゅん"],a:0,e:"「逡巡（しゅんじゅん）」はためらうこと・躊躇することです。"},
    {t:"失敗した原因を<u>糊塗</u>しようとしても、すぐにばれてしまった。",o:["のりと","こと","こぬ","とりつ"],a:1,e:"「糊塗（こと）」は失敗や欠点を表面だけ取り繕うことです。"},
    {t:"その老政治家の発言は<u>示唆</u>に富んでいた。",o:["じさ","しさ","しそ","じそ"],a:1,e:"「示唆（しさ）」はそれとなく示すこと・ほのめかすことです。"},
    {t:"彼の行動は法の精神に<u>悖る</u>ものだ。",o:["もとる","さからう","みちびく","はいる"],a:0,e:"「悖る（もとる）」は道義・道理に背く・反するという意味の難読語です。"},
    {t:"この映画は現代社会の<u>矛盾</u>を鋭く描いている。",o:["むじゅん","ぼうじゅん","もじゅん","むとん"],a:0,e:"「矛盾（むじゅん）」は辻褄が合わない・相反すること。語源は中国の故事から。"},
    {t:"その政治家は汚職を<u>隠蔽</u>しようとした。",o:["いんへい","いんぺい","おんぺい","おんへい"],a:1,e:"「隠蔽（いんぺい）」は事実・証拠などを隠し包み隠すことです。"},
    {t:"過去の失敗を<u>払拭</u>して再出発した。",o:["はらい","ふっしょく","ふっしき","はらぬぐい"],a:1,e:"「払拭（ふっしょく）」は完全に取り除くこと・一掃することです。"},
    {t:"彼は<u>傀儡</u>政権の陰に実力者が潜んでいると指摘した。",o:["かいらい","くぐつ","きらい","けらい"],a:0,e:"「傀儡（かいらい）」は他者に操られる存在。人形・操り人形の意味もあります。"},
    {t:"試験前の<u>杞憂</u>は、結果発表後に笑い話になった。",o:["きゆ","きゆう","きぐ","きうれ"],a:1,e:"「杞憂（きゆう）」は取り越し苦労・無駄な心配のことです。"},
    {t:"彼女の態度には<u>嫌悪</u>感を覚えた。",o:["きらいも","けんお","げんお","けんぞう"],a:1,e:"「嫌悪（けんお）」はひどく嫌うこと・憎しみを感じることです。"},
    {t:"経営陣の<u>更迭</u>が発表された。",o:["こうそつ","こうてつ","こうかえ","こうちつ"],a:1,e:"「更迭（こうてつ）」は役職者をその地位から替えること・交代させることです。"},
    {t:"二人の意見には<u>齟齬</u>があった。",o:["しょご","そご","そぎょ","じょご"],a:1,e:"「齟齬（そご）」は食い違い・不一致のことです。「齟齬をきたす」と使います。"},
    {t:"彼の計画は途中で<u>頓挫</u>してしまった。",o:["とんざ","とんじゃ","どんざ","とんさ"],a:0,e:"「頓挫（とんざ）」は物事が途中で行き詰まり止まってしまうことです。"},
    {t:"その国では独裁者が<u>跋扈</u>していた。",o:["ばっこ","ほっこ","はっこ","ばっく"],a:0,e:"「跋扈（ばっこ）」は悪人・権力者などが我が物顔に振る舞うことです。"},
    {t:"食物をよく<u>咀嚼</u>することは健康に良い。",o:["そしゃく","しゃくそ","じゅしゃく","そくしゃく"],a:0,e:"「咀嚼（そしゃく）」は食べ物をよく噛み砕くこと。転じて内容をよく理解することも指します。"},
    {t:"彼女は甘いものへの<u>嗜好</u>が強い。",o:["しこう","しこ","すきこう","たのしこう"],a:0,e:"「嗜好（しこう）」は特定のものを好んで楽しむ傾向・好みのことです。"},
    {t:"選手の<u>失墜</u>したイメージを回復するのは難しい。",o:["しっちゅい","しっつい","しっとい","しつい"],a:1,e:"「失墜（しっつい）」は地位・名声などが落ちること・失われることです。"},
    {t:"政府は景気回復への<u>懸念</u>を示した。",o:["かんね","けねん","かんねん","けんゆ"],a:1,e:"「懸念（けねん）」は心配・不安・気がかりのことです。"},
    {t:"社運を賭けたプロジェクトに<u>腐心</u>する日々が続いた。",o:["ふしん","ふぐさ","ふうしん","くさんしん"],a:0,e:"「腐心（ふしん）」は心を悩ませながら努力することです。「腐」は腐るではなく、悩み苦しむ意。"},
    {t:"情報が<u>錯綜</u>して、真相がわからなくなった。",o:["さくとう","さくそう","さっそう","しゃくそう"],a:1,e:"「錯綜（さくそう）」は複雑に絡み合い混乱していることです。"},
    {t:"彼の発言は<u>婉曲</u>な表現を多く含んでいた。",o:["えんきょく","えんく","わんきょく","おうきょく"],a:0,e:"「婉曲（えんきょく）」は遠回しな・角が立たないような言い方のことです。"},
    {t:"リーダーとして部下の気持ちを<u>慮る</u>ことが大切だ。",o:["おもう","かんがえる","おもんぱかる","はかる"],a:2,e:"「慮る（おもんぱかる）」は十分に考慮すること・思いやりを持って深く考えることです。"},
    {t:"彼の判断は<u>恣意的</u>だと批判された。",o:["しいてき","しょいてき","じいてき","えいてき"],a:0,e:"「恣意的（しいてき）」は自分の気ままな意志によるもの・論理的根拠がないことです。"},
    {t:"試合に負けた選手は<u>蹂躙</u>されたと感じた。",o:["じゅうりん","にゅうりん","じゅうらん","じゅくりん"],a:0,e:"「蹂躙（じゅうりん）」は踏みにじること・力で制圧・侵害することです。"},
    {t:"このプロジェクトの<u>嚆矢</u>は10年前に遡る。",o:["こうし","きゅうし","はじめ","こくし"],a:0,e:"「嚆矢（こうし）」は物事の始まり・最初のことです。もともと「鳴り響く矢」の意味。"},
    {t:"今回の受賞作品は同世代の中でも<u>白眉</u>だ。",o:["はくが","しろまゆ","はくび","はくまゆ"],a:2,e:"「白眉（はくび）」は多くの中で最も優れているもの・人のことです。"},
    {t:"彼がここまで出世できたのは<u>僥倖</u>としか言いようがない。",o:["ぎょうこう","こうこう","ようこう","きょうこう"],a:0,e:"「僥倖（ぎょうこう）」は思いがけない幸運・棚ぼたのことです。"},
    {t:"この理論の<u>蓋然性</u>は高いと研究者たちは見ている。",o:["がいぜんせい","けいぜんせい","かくぜんせい","おおむねせい"],a:0,e:"「蓋然性（がいぜんせい）」はある事柄が起こりうる確からしさ・可能性のことです。"},
    {t:"新しい政策の導入にあたり、専門家の<u>忖度</u>が問題となった。",o:["そんたく","すいたく","そくたく","さんたく"],a:0,e:"「忖度（そんたく）」は相手の心を推し量ること。近年は権力者への過剰配慮の意でも使われます。"},
    {t:"彼女は毎日その詩を<u>反芻</u>しながら意味を考えた。",o:["はんすう","はんそ","ふりかえり","はんちゅう"],a:0,e:"「反芻（はんすう）」は繰り返し思い返して味わうこと。もとは牛などが飲み込んだものを戻して再び噛む行為。"},
    {t:"王は幼い王子を特に<u>寵愛</u>していた。",o:["ちょうあい","りゅうあい","きゅうあい","そうあい"],a:0,e:"「寵愛（ちょうあい）」は特別にかわいがり愛すること・溺愛することです。"},
    {t:"彼は上司に<u>罵倒</u>されても平然としていた。",o:["ばとう","まとう","はとう","ばどう"],a:0,e:"「罵倒（ばとう）」はひどい言葉でののしること・口汚くけなすことです。"},
    {t:"失恋した彼は深く<u>懊悩</u>していた。",o:["こうのう","おうのう","こうのん","あうのう"],a:1,e:"「懊悩（おうのう）」は深く悩み苦しむこと・悶々とすることです。"},
    {t:"批判を受けて彼は<u>萎縮</u>してしまった。",o:["なえちぢ","いしゅく","えんしゅく","いじく"],a:1,e:"「萎縮（いしゅく）」は委縮すること・萎れて縮むこと。プレッシャーで動けなくなることも指します。"},
    {t:"都会の<u>喧騒</u>から離れ、静かな田舎で暮らしたい。",o:["けんそう","きんそう","けんさわ","うるそう"],a:0,e:"「喧騒（けんそう）」はやかましくて騒がしいこと・騒がしい状態・場所のことです。"},
    {t:"彼女の態度は<u>傲慢</u>だと周囲から嫌われていた。",o:["ごうまん","こうまん","ごうばん","こうばん"],a:0,e:"「傲慢（ごうまん）」はおごり高ぶり、他人を見下すような態度のことです。"},
    {t:"その作家の文章は<u>晦渋</u>で読みにくい。",o:["かいじゅう","かいしゅう","かいじゅ","まんじゅ"],a:0,e:"「晦渋（かいじゅう）」は意味がわかりにくく難解であることです。"},
    {t:"会社の業績悪化で彼は<u>逼迫</u>した状況に追い込まれた。",o:["いっぱく","ひっぱく","ひんぱく","りっぱく"],a:1,e:"「逼迫（ひっぱく）」は余裕がなくなり追い詰められた状態のことです。"},
    {t:"彼は細部に<u>拘泥</u>して、全体を見失っていた。",o:["こうでい","きょくでい","こうない","こうにち"],a:0,e:"「拘泥（こうでい）」は些細なことにこだわること・固執することです。"},
    {t:"彼女は自分の考えを<u>蔑む</u>ことなく主張し続けた。",o:["さけぶ","さげすむ","まげる","しりぞく"],a:1,e:"「蔑む（さげすむ）」は見下すこと・軽蔑することです。"},
    {t:"その研究者は一般通念に<u>抗う</u>理論を発表した。",o:["したがう","もとずく","あらがう","にわかう"],a:2,e:"「抗う（あらがう）」は逆らうこと・抵抗することです。"},
    {t:"長い交渉の末、ようやく<u>妥結</u>した。",o:["だけつ","たけつ","だけい","やわけつ"],a:0,e:"「妥結（だけつ）」は話し合いがまとまり合意に達することです。"},
    {t:"その小説は<u>刹那</u>的な美しさに満ちていた。",o:["さつな","せんな","せつな","さっな"],a:2,e:"「刹那（せつな）」は極めて短い瞬間のこと。「刹那的」は先のことを考えず今だけを楽しむ様子。"},
    {t:"彼の証言には<u>瑕疵</u>があると弁護側は主張した。",o:["かし","けし","かじ","がし"],a:0,e:"「瑕疵（かし）」はキズ・欠点・欠陥のことです。法律用語としても「瑕疵担保責任」などで使われます。"},
  ]
},

// ════════════════════════════════════════════
// 問題２　文脈規定
// ════════════════════════════════════════════
vocab: {
  name:"問題２　文脈規定",
  desc:"（　）に入れるのに最もよいものを１〜４から選んでください。",
  questions:[
    {t:"彼女は謝罪の言葉を述べたが、その態度には真摯さが（　）、かえって相手の怒りを買った。",o:["あふれ","もれ","欠け","満ち"],a:2,e:"「真摯さが欠け（かけ）」で誠実さが足りないという意味。「かえって怒りを買う」という逆接がヒントです。"},

    {t:"彼は昔の失敗を（　）に、慎重に行動するようになった。",o:["反省","教訓","手本","見本"],a:1,e:"「教訓（きょうくん）にする」は過去の経験から学ぶ、という意味です。"},

    {t:"その計画は多くの（　）を経て、ようやく実現した。",o:["紆余曲折","失敗","挫折","苦難"],a:0,e:"「紆余曲折（うよきょくせつ）を経て」はさまざまな困難や変転を経てきたという意味です。"},

    {t:"その会社はスキャンダルの（　）を余儀なくされた。",o:["謝罪","釈明","公表","説明"],a:1,e:"「釈明（しゃくめい）を余儀なくされた」は事情・理由を説明せざるを得ない状況に追い込まれたことです。"},

    {t:"彼の批判は<u>的外れ</u>だと感じた。",o:["鋭い","本質を突いていた","要点を外している","感情的だ"],a:2,e:"「的外れ（まとはずれ）」は要点・本質をとらえていないこと・見当違いなことです。"},
    {t:"この実験の結果は<u>示唆的</u>だ。",o:["確実","いろいろなことをほのめかしている","無意味","複雑"],a:1,e:"「示唆的（しさてき）」は何かをほのめかしている・何らかの意味を含んでいることです。"},
    {t:"彼女は自分の意見を<u>婉曲</u>に伝えた。",o:["直接的に","遠回しに穏やかに","強く","感情的に"],a:1,e:"「婉曲（えんきょく）に」は遠回しに・角が立たないように、という意味です。"},
    {t:"その申し出は<u>慇懃無礼</u>だった。",o:["非常に丁寧","表面は丁寧だが実は失礼","非常に失礼","礼儀正しすぎる"],a:1,e:"「慇懃無礼（いんぎんぶれい）」は言葉遣いや態度は丁寧に見えながら、実際は失礼なことです。"},
    {t:"彼の行動は<u>突飛</u>だと思われた。",o:["勇敢","常識外れで奇抜","危険","無謀"],a:1,e:"「突飛（とっぴ）な行動」は常識から外れて驚くような奇抜な行動のことです。"},
    {t:"その問題は<u>山積</u>している。",o:["解決した","すべて小さい","たくさん積み重なっている","少ない"],a:2,e:"「山積（さんせき）している」は問題・課題などがたくさん積み重なっている状態です。"},
    {t:"彼女は<u>辛抱強く</u>待ち続けた。",o:["怒りながら","忍耐力を持ってじっくりと","せっかちに","渋々"],a:1,e:"「辛抱強く（しんぼうづよく）」は根気よく・我慢しながら粘り強くという意味です。"},
    {t:"その提案は<u>実現可能</u>だと判断された。",o:["非現実的","夢物語","実際にできると認められた","難しすぎる"],a:2,e:"「実現可能（じつげんかのう）」は実際に行うことができる・達成できることです。"},
    {t:"彼は<u>詭弁</u>を用いて相手を言い負かした。",o:["正論","感情論","もっともらしい見せかけだけの議論","鋭い論理"],a:2,e:"「詭弁（きべん）」は一見もっともらしいが実際には誤っている議論・こじつけのことです。"},
    {t:"その映画は<u>通俗的</u>すぎて批評家に好まれなかった。",o:["難解すぎて","芸術的すぎて","大衆向けで平凡な","暴力的すぎて"],a:2,e:"「通俗的（つうぞくてき）」は大衆に受け入れられやすい程度の内容・芸術的深みがないことです。"},
    {t:"彼女の行動は<u>奇特</u>だと称えられた。",o:["奇妙","めずらしく感心なこと","危険","奇抜"],a:1,e:"「奇特（きとく）」はめずらしいほど感心なこと・殊勝なこと。プラスの意味で使われます。"},
    {t:"その説明は<u>冗長</u>だった。",o:["短すぎた","わかりにくかった","必要以上に長くくどい","不正確だった"],a:2,e:"「冗長（じょうちょう）」は必要以上に長くてくどいこと・無駄が多いことです。"},
    {t:"彼は<u>狡猾</u>な手段で成功した。",o:["正直な","大胆な","ずる賢い","強引な"],a:2,e:"「狡猾（こうかつ）な」はずる賢い・悪知恵を働かせる、という意味です。"},
    {t:"その報告書の内容は<u>精緻</u>だと評価された。",o:["雑","簡単","非常に詳細で精密","わかりやすい"],a:2,e:"「精緻（せいち）な」は非常に細かく精密なことです。"},
    {t:"彼女の発言は<u>辛辣</u>だった。",o:["穏やか","感情的","非常に厳しくて手厳しい","思いやりがある"],a:2,e:"「辛辣（しんらつ）な」は言葉などが非常に手厳しく、刺さるようなことです。"},
    {t:"その政策は<u>場当たり的</u>だと批判された。",o:["長期的","計画的","その場その場でその時だけの対応","効果的"],a:2,e:"「場当たり的（ばあたりてき）」はその場しのぎで、全体的な計画や一貫性がないことです。"},
    {t:"彼の意見は<u>偏見</u>に満ちていた。",o:["客観的","公平","一方的で先入観による判断","論理的"],a:2,e:"「偏見（へんけん）」は不公平な先入観・一方的な考えのことです。"},
    {t:"彼女は問題を<u>矮小化</u>して語った。",o:["大げさに","正確に","実際より小さく見せて","詳しく"],a:2,e:"「矮小化（わいしょうか）する」は実際より小さく・重要でないものとして扱うことです。"},
    {t:"そのアイデアは<u>斬新</u>だと評価された。",o:["平凡","従来にない新しい","危険","難解"],a:1,e:"「斬新（ざんしん）な」はこれまでにない新しい発想・手法のことです。"},
    {t:"彼は<u>寡黙</u>な人として知られていた。",o:["おしゃべりな","感情的","無口で言葉が少ない","積極的"],a:2,e:"「寡黙（かもく）な」は口数が少ない・物静かなことです。"},
    {t:"その状況は<u>逼迫</u>していた。",o:["余裕があった","非常に厳しく追い詰められた","複雑だった","混乱していた"],a:1,e:"「逼迫（ひっぱく）した状況」は余裕がなく追い詰められた状態です。"},
    {t:"彼女は<u>豁達</u>な性格で知られていた。",o:["内気な","慎重な","心が広くおおらかな","厳格な"],a:2,e:"「豁達（かったつ）な」は心が広く小事にこだわらないおおらかな性格のことです。"},
    {t:"その発言は<u>軽口</u>すぎると批判された。",o:["重すぎる","真剣すぎる","軽はずみで不謹慎な","専門的すぎる"],a:2,e:"「軽口（かるくち）」は軽はずみな・不謹慎なことを気軽に言うことです。"},
    {t:"彼の態度は<u>慇懃</u>だった。",o:["失礼","非常に丁寧","無愛想","冷たい"],a:1,e:"「慇懃（いんぎん）な」は非常に丁寧で礼儀正しいことです。ただし過度だと「慇懃無礼」になります。"},
    {t:"その批評は<u>的確</u>だと感じた。",o:["感情的","誤っている","正確で要点をよく捉えている","難解"],a:2,e:"「的確（てきかく）な」は正確で適切・要点をよく得ていることです。"},
    {t:"彼女の行動は<u>利他的</u>だと称えられた。",o:["自己中心的","自分より他人のためを考える","合理的","感情的"],a:1,e:"「利他的（りたてき）」は自分の利益より他人・集団の利益を優先する考え・行動のことです。"},
  ]
},

// ════════════════════════════════════════════
// 問題４　用法
// ════════════════════════════════════════════
usage: {
  name:"問題４　用法",
  desc:"次の言葉の使い方として最もよいものを１〜４から選んでください。",
  questions:[
    {t:"「凌ぐ（しのぐ）」",o:["彼は先輩を凌いで、先にゴールに到達できなかった。","今年の売上は昨年を凌ぐ勢いで伸びている。","彼女の失敗を凌いで、プロジェクトを完成させた。","困難を凌いだ結果、彼は職を失った。"],a:1,e:"「凌ぐ」には①他を超える・上回る（昨年を凌ぐ）②困難をどうにか乗り切る（苦境を凌ぐ）の意味があります。"},
    {t:"「おぼつかない」",o:["彼の話は非常におぼつかなく、誰もが感動した。","政策はおぼつかない支持を受け、成功が期待される。","足腰が弱った祖父の歩みはおぼつかなかった。","英語はおぼつかなく、海外でも通じた。"],a:2,e:"「おぼつかない」は不安定でたよりない様子。足腰が弱った老人の歩みに使うのが正しい用法です。"},
    {t:"「逡巡（しゅんじゅん）する」",o:["決断を求められた彼は、逡巡した後、断ることにした。","試験に合格し、逡巡して喜んだ。","逡巡した結果、プロジェクトは大成功を収めた。","子供たちは公園で逡巡しながら遊んでいた。"],a:0,e:"「逡巡する」はためらう・躊躇するという意味。決断できず迷っている場面で使います。"},
    {t:"「杞憂（きゆう）」",o:["試験の結果が悪かったのは杞憂だった。","彼の杞憂は正しく、事故は本当に起きた。","杞憂をもとに、しっかりした対策をとるべきだ。","失敗するかもという不安は杞憂に終わり、発表は大成功だった。"],a:3,e:"「杞憂」は取り越し苦労のこと。「杞憂に終わる」（心配が無駄だったと判明する）という使い方が正しいです。"},
    {t:"「拭いきれない」",o:["彼の優秀さは拭いきれないほど明らかだ。","その事件への関与について、拭いきれない疑惑が残っている。","彼女の美しさは拭いきれない印象を与えた。","その店の料理は拭いきれないほどおいしかった。"],a:1,e:"「拭いきれない」は否定的・懸念される感情・疑念が消えない場合に使います。疑惑・不安・後悔などと組みます。"},
    {t:"「腑に落ちない」",o:["彼の説明は腑に落ちなくて、非常によく理解できた。","あの判断はどうも腑に落ちない。","その結果は腑に落ちないほど素晴らしかった。","彼女の発言は腑に落ちていて、誰もが納得した。"],a:1,e:"「腑に落ちない（ふにおちない）」は納得できない・理解・承服できない気持ちを表す表現です。"},
    {t:"「忸怩（じくじ）たる思い」",o:["試合に勝って忸怩たる思いがした。","部下を守れなかったことへの忸怩たる思いが残った。","プレゼンが成功して忸怩たる思いを感じた。","合格した時に忸怩たる思いで祝った。"],a:1,e:"「忸怩（じくじ）たる思い」は深く恥じ入る・自分を省みて恥ずかしく思うことです。失敗・後悔の場面で使います。"},
    {t:"「いたたまれない」",o:["あまりにも楽しくて、いたたまれない気分だった。","その場の気まずい雰囲気に、いたたまれなくなって席を立った。","合格の知らせを聞いて、いたたまれなかった。","友達と遊んでいて、いたたまれない時間を過ごした。"],a:1,e:"「いたたまれない」はその場にいることに耐えられない状況・気持ちを表します。恥ずかしさや居心地の悪さから使います。"},
    {t:"「はばかられる」",o:["彼はどんな場面でも意見を述べることがはばかられなかった。","上司のいる前では、本音を言うことがはばかられた。","その問題ははばかられるほど簡単だった。","勉強するのがはばかられて、遊んでしまった。"],a:1,e:"「はばかられる」は遠慮・気兼ねが必要で、なかなかしにくい・躊躇われるという意味です。"},
    {t:"「やるせない」",o:["試合に勝って、やるせない気持ちになった。","誰にも理解されず、やるせない思いが込み上げた。","おいしい食事をして、やるせなかった。","合格発表の日、やるせない喜びがあふれた。"],a:1,e:"「やるせない」はどうしようもなく切ない・悲しい・やりきれない気持ちを表します。"},
    {t:"「余儀なくされる」",o:["彼は自由な環境に恵まれ、余儀なくされて成功した。","台風の影響でイベントの中止を余儀なくされた。","余儀なくされた結果、すべてがうまくいった。","彼女は余儀なくされながら、快適に暮らしていた。"],a:1,e:"「余儀なくされる（よぎなくされる）」はやむを得ず、他に選択肢がなくそうするしかない状況に追い込まれることです。"},
    {t:"「したたかな」",o:["彼女はしたたかな性格で、誰にでも素直に従った。","交渉の場で彼はしたたかに立ち回り、有利な条件を引き出した。","子供はしたたかに遊んでいた。","その映画はしたたかな内容で評判になった。"],a:1,e:"「したたかな」は強かで簡単には屈しない・抜け目なく粘り強い様子を表します。"},
    {t:"「とどまることを知らない」",o:["その企業の成長はとどまることを知らなかったため、すぐに倒産した。","人口増加はとどまることを知らず、今や世界的問題となっている。","彼女の勉強はとどまることを知らず、いつも早く終わった。","とどまることを知らない結果、計画は成功した。"],a:1,e:"「とどまることを知らない」は止まらずにどんどん続く・際限がない状態を表す表現です。"},
    {t:"「物の見事に」",o:["彼は物の見事に失敗した計画を再び立て直した。","彼女は物の見事に試験に合格した。","物の見事な料理を食べた。","物の見事に準備した結果、うまくいかなかった。"],a:1,e:"「物の見事に（もののみごとに）」は非常に鮮やかに・完璧に、という強調表現です。成功・達成の場面で使います。"},
    {t:"「眉をひそめる」",o:["素晴らしい演奏に、聴衆は眉をひそめた。","彼の非常識な発言に、周囲は眉をひそめた。","合格の報告を聞いて、母は眉をひそめた。","おいしい料理に、彼女は眉をひそめた。"],a:1,e:"「眉をひそめる（まゆをひそめる）」は不快・嫌悪・心配を感じて顔をしかめる表情のことです。"},
    {t:"「嚆矢（こうし）となる」",o:["その失敗は彼の嚆矢となった。","このプロジェクトは業界改革の嚆矢となった。","嚆矢となることを恐れて、慎重になった。","彼は嚆矢となる結果を恐れた。"],a:1,e:"「嚆矢となる」は物事の始まり・先駆けとなる、という意味です。良い意味で先頭を切る場面で使います。"},
    {t:"「色をなす」",o:["彼女は喜びで色をなした。","批判を受けた彼は怒りで色をなした。","絵を描きながら、色をなした。","秋の山が色をなしていた。"],a:1,e:"「色をなす（いろをなす）」は怒りや興奮のため顔色が変わることです。感情が高ぶる場面で使います。"},
    {t:"「相好を崩す（そうごうをくずす）」",o:["叱られた生徒は相好を崩した。","孫の顔を見て、祖父は相好を崩した。","問題を解けず、彼は相好を崩した。","会議で叱責され、部長は相好を崩した。"],a:1,e:"「相好を崩す」は喜びや親しみで表情が緩んでにこやかになることです。嬉しい場面で使います。"},
    {t:"「舌を巻く」",o:["辛い料理を食べて舌を巻いた。","彼の驚異的な記憶力に舌を巻いた。","言葉に詰まって舌を巻いた。","失敗して舌を巻いた。"],a:1,e:"「舌を巻く（したをまく）」は非常に驚き感心すること・感嘆のあまり言葉が出ない様子です。"},
    {t:"「揚げ足を取る」",o:["相手の議論の核心を揚げ足を取って批判した。","些細な言葉のミスを揚げ足を取って非難した。","彼は揚げ足を取ることなく、正論を述べた。","試合で相手の揚げ足を取って勝利した。"],a:1,e:"「揚げ足を取る（あげあしをとる）」は相手の言葉の細かなミスや矛盾を取り上げてからかったり非難したりすることです。"},
    {t:"「口を割る」",o:["食事中に思わず口を割ってしまった。","容疑者は長時間の尋問の末、ついに口を割った。","彼は秘密を守り続け、口を割ることなく退いた。","口を割ることで健康になった。"],a:1,e:"「口を割る（くちをわる）」は隠していた秘密・情報をとうとう話してしまうことです。"},
    {t:"「高をくくる」",o:["危険だと判断し、高をくくって慎重に行動した。","大丈夫だろうと高をくくっていたら、失敗してしまった。","相手の実力を高をくくって真剣に対策した。","高をくくった結果、大きな成果を上げた。"],a:1,e:"「高をくくる（たかをくくる）」は相手や状況を軽く見て油断することです。"},
    {t:"「二の足を踏む」",o:["試合前に二の足を踏んで、勢いよく走り出した。","高額な投資に二の足を踏んで、なかなか決断できなかった。","二の足を踏んだ結果、目標を達成できた。","準備万端で二の足を踏まずに行動した。"],a:1,e:"「二の足を踏む（にのあしをふむ）」はためらって前に進めない・躊躇することです。"},
    {t:"「胸算用（むなざんよう）が外れる」",o:["準備が完璧で胸算用が外れた。","期待していた利益が出ず、胸算用が外れた。","胸算用が外れて、予想以上の成果を得た。","胸算用が外れることなく、計画通りに進んだ。"],a:1,e:"「胸算用が外れる」は心の中で計算していた予想・見込みが外れることです。"},
    {t:"「水泡（すいほう）に帰す」",o:["長年の努力が水泡に帰した。","困難を乗り越えて、水泡に帰す成果を得た。","水泡に帰すほど素晴らしい成功だった。","彼の計画は水泡に帰して、さらに発展した。"],a:0,e:"「水泡に帰す（すいほうにきす）」は努力や計画が泡のように消えてしまう・無駄になることです。"},
    {t:"「折り紙つき」",o:["その品物の品質は折り紙つきで信頼できる。","折り紙つきの欠陥品が市場に出回った。","折り紙つきの失敗作が称賛された。","折り紙つきの問題点があることで有名だ。"],a:0,e:"「折り紙つき（おりがみつき）」は保証済みで確かな・品質や能力が保証されていることです。"},
    {t:"「後手に回る（ごてにまわる）」",o:["積極的に先手を打つことで後手に回ることができた。","対応が遅れ、常に後手に回ってしまった。","後手に回ることで、相手より有利になった。","早めの決断で後手に回ることを望んだ。"],a:1,e:"「後手に回る」は相手の行動に対して受け身になる・先手を打てずに後れをとることです。"},
    {t:"「一矢報いる（いっしむくいる）」",o:["完全に敗北し、一矢報いることができなかった。","試合には負けたが、最後に一矢報いることができた。","一矢報いることで相手を完全に倒した。","友人のために一矢報いて感謝された。"],a:1,e:"「一矢報いる」は敗色が濃い中でも少し反撃・反論することです。"},
    {t:"「羹（あつもの）に懲りて膾（なます）を吹く」",o:["大きな成功の後、次の挑戦にも積極的になることだ。","一度失敗して懲りたために、必要もないのに用心すること。","過去の失敗から学んで、次に成功することだ。","膾を吹いて冷ますようにゆっくり進むことだ。"],a:1,e:"「羹に懲りて膾を吹く」は以前の失敗にこりて、必要もないのに臆病になりすぎることです。"},
    {t:"「とんとん拍子（びょうし）」",o:["何度も失敗した末に成功した様子。","何事もなくすいすい順調に進む様子。","ゆっくりと慎重に進む様子。","一進一退を繰り返しながら進む様子。"],a:1,e:"「とんとん拍子」は物事が滞ることなくどんどん順調に進む様子を表します。"},
    {t:"「糠（ぬか）に釘（くぎ）」",o:["非常に効果的な方法のこと。","手応えがなく何の効果も得られないこと。","急いでも仕方がないということ。","細かいことにこだわりすぎること。"],a:1,e:"「糠に釘（ぬかにくぎ）」は言っても手応えがなく効果がないことのたとえです。「暖簾に腕押し」と同義。"},
    {t:"「腹に一物（いちもつ）」",o:["たくさん食べた後の満腹感のこと。","心の中に秘かなたくらみや下心があること。","実力を隠して慎重に行動すること。","胃が痛くなるほど緊張すること。"],a:1,e:"「腹に一物（はらにいちもつ）」は表面に出さない秘かなたくらみや下心を持っていることです。"},
    {t:"「天下り（あまくだり）的な」",o:["高い理想を掲げて進む様子。","上から命令・押し付けるような様子。","神様からの恩恵のような素晴らしい様子。","慎重に上を目指す様子。"],a:1,e:"「天下り的（てんくだりてき）」な発言・指示は上位者が下位者に一方的に押し付けることです。"},
    {t:"「言わずもがな」",o:["言いたくても言えない様子。","わざわざ言うまでもなく当然・明らかなこと。","言葉では表現できないほど素晴らしいこと。","気にしなくてもよいこと。"],a:1,e:"「言わずもがな（いわずもがな）」はわざわざ言う必要もないほど明らかなこと・また言わないほうがよいことです。"},
    {t:"「いぶかしむ」",o:["とても驚いて感動すること。","不思議に思い疑わしく思うこと。","恐ろしくて避けようとすること。","深く考えて悩むこと。"],a:1,e:"「いぶかしむ」は変だと思い疑う・不思議に感じることです。「いぶかしげな表情」などと使います。"},
    {t:"「しゃにむに」",o:["静かに・慎重に。","がむしゃらに・一心不乱に。","のんびりと・ゆっくりと。","慎重に・計画的に。"],a:1,e:"「しゃにむに」はがむしゃらに・一目散に・見境なく突き進む様子を表す副詞です。"},
    {t:"「面目（めんぼく）を施す」",o:["恥をかくこと。","名誉を損なうこと。","立場や名誉を高めること。","責任をとること。"],a:2,e:"「面目を施す（めんぼくをほどこす）」は名誉・体裁を保ち、周囲から認められることです。"},
    {t:"「しのぎを削る」",o:["危険を避けてうまく行動すること。","激しく争い、競い合うこと。","大切なものを削って減らすこと。","互いに協力し合うこと。"],a:1,e:"「しのぎを削る（しのぎをけずる）」は激しく競い合う・争うことです。刀の刃を削り合うほど激しい戦いのたとえです。"},
    {t:"「余念がない」",o:["他のことを考えずに熱中している。","特に考えがない・軽率な様子。","心配事が多い様子。","余裕があって落ち着いている。"],a:0,e:"「余念がない（よねんがない）」は他のことを考える余裕もないほど一つのことに打ち込んでいることです。"},
    {t:"「水を差す」",o:["会話に参加すること。","うまく進んでいることを邪魔すること。","事態を良い方向に変えること。","困っている人を助けること。"],a:1,e:"「水を差す（みずをさす）」は順調に進んでいることや良い雰囲気を邪魔することです。"},
    {t:"「骨身を惜しまず」",o:["肉体的な痛みに耐えること。","身体の疲れを無視して働くこと。","手間・苦労を厭わず一生懸命に。","体力を温存して行動すること。"],a:2,e:"「骨身を惜しまず（ほねみをおしまず）」は苦労や手間を厭わず、全力で取り組む様子です。"},
    {t:"「虫の知らせ」",o:["嫌な予感・不吉な感じ。","細かいことを気にしすぎること。","自然の変化を感じ取ること。","根拠のない迷信を信じること。"],a:0,e:"「虫の知らせ（むしのしらせ）」は根拠はないが何か悪いことが起きそうな予感・胸騒ぎのことです。"},
    {t:"「なし崩し（なしくずし）」",o:["突然大きく変化すること。","段階を経て少しずつ既成事実にしていくこと。","問題を解決すること。","明確な計画なく行動すること。"],a:1,e:"「なし崩しに」は少しずつ変えていって気づいたら大きく変わっていること・既成事実化することです。"},
    {t:"「もとより」",o:["元の場所から。","当然のこと・言うまでもなく。","最初から計画した通り。","根本的な問題として。"],a:1,e:"「もとより」は「もちろん・言うまでもなく・始めから」という意味の副詞です。"},
    {t:"「取り付く島もない」",o:["困っていて助けを求めている。","話しかけても全く相手にされない。","問題が複雑で解決策がない。","孤立して味方がいない。"],a:1,e:"「取り付く島もない（とりつくしまもない）」は話しかけても相手にされず手がかりもないことです。"},
    {t:"「押しが強い」",o:["体力・腕力がある。","強引に自分の意見・要求を通そうとする。","応援・支援をしっかりしてくれる。","責任感が強い。"],a:1,e:"「押しが強い（おしがつよい）」は自分の意見や要求を強引に通そうとする・遠慮なく主張する様子です。"},
    {t:"「耳が肥える（みみがこえる）」",o:["多くの情報を集める能力がある。","音楽などを聴く経験が豊富で鑑賞眼がある。","人の話をよく聞く姿勢がある。","内緒話を聞く機会が多い。"],a:1,e:"「耳が肥える」は良い音楽などを多く聴いて鑑賞眼・判別眼が優れていることです。"},
    {t:"「五十歩百歩（ごじっぽひゃっぽ）」",o:["わずかな差があるが本質的には同じであること。","優れたものと劣ったものの差は大きいこと。","段階的に物事を進めるべきこと。","多数対少数の戦いのこと。"],a:0,e:"「五十歩百歩」は多少の違いはあっても本質的には同じようなものだというたとえです。"},
    {t:"「臥薪嘗胆（がしんしょうたん）」",o:["苦しい状況から逃げること。","目的達成のために苦労・苦難に耐えること。","過去の失敗を後悔し続けること。","無理な計画を強行すること。"],a:1,e:"「臥薪嘗胆（がしんしょうたん）」は目的を達成するために辛苦に耐え努力することです。復讐を誓って苦しみに耐えた故事から。"},
    {t:"「付け焼き刃（つけやきば）」",o:["古くなった道具を修理して使うこと。","その場しのぎで身につけた知識・技能。","切れ味の良い鋭い批評のこと。","長年の努力で磨かれた技術のこと。"],a:1,e:"「付け焼き刃」は一時的にごまかすだけの浅い知識・技術のことです。試験前の詰め込み勉強などに使います。"},
    {t:"「蛇足（だそく）」",o:["慎重すぎて行動が遅いこと。","余計な付け加えで全体をこわすもの。","問題の核心から外れた議論。","他人の失敗を利用すること。"],a:1,e:"「蛇足（だそく）」はなくてもよい余計なものを付け加えること。蛇に足を描いてしまう故事から。"},
  ]
},

// ════════════════════════════════════════════
// 問題５　文の文法
// ════════════════════════════════════════════
grammar: {
  name:"問題５　文の文法",
  desc:"（　）に入れるのに最もよいものを１〜４から選んでください。",
  questions:[
    {t:"長年の努力が実を結び、彼女は夢（　）大学に入学することができた。",o:["に向けての","であった","での","への"],a:1,e:"「彼女の夢であった大学」＝「彼女が夢見ていた大学」という同格の形が自然です。"},
    {t:"子供のころ親しんだ故郷の景色は、何十年経った今（　）、脳裏に焼き付いている。",o:["もなお","にして","とはいえ","ともなると"],a:0,e:"「今もなお」は現在においてもまだ続いているという状態を強調する表現です。"},
    {t:"このプロジェクトが失敗した（　）、責任をとって辞任するつもりだ。",o:["としたら","ようでは","にしては","暁には"],a:3,e:"「〜暁には（あかつきには）」は〜した場合には・その時には、という意味です。"},
    {t:"新入社員（　）、敬語の使い方が完全でないのは仕方がないとも言える。",o:["にとって","からすれば","とあれば","だけあって"],a:2,e:"「〜とあれば」はその立場・状況であれば、という条件を示す表現です。"},
    {t:"環境が整えば整う（　）、彼女の研究はより深まっていった。",o:["ほど","につれ","ほどに","だけ"],a:0,e:"「〜ば〜ほど」は比例表現で「条件が変化するにつれてそれに応じてより〜になる」という意味です。"},
    {t:"彼の無実は証明されて（　）。",o:["しまった","みせた","いた","よかった"],a:0,e:"「〜てしまった」は残念・後悔・意外な完了を表します。ここでは無実が証明された良い結果でも感嘆的に使います。"},
    {t:"失敗を（　）、次のステップに進む勇気を持つことが大切だ。",o:["恐れつつも","恐れながらも","恐れずとも","恐れてこそ"],a:3,e:"「〜てこそ」はそうするからこそ・それがあってはじめて、という強調表現です。"},
    {t:"彼女がその場を（　）、全員が安心した。",o:["仕切ってこそ","仕切るなり","仕切るや否や","仕切るにあたって"],a:2,e:"「〜るや否や（やいなや）」はある動作が終わるとほぼ同時に次の動作が起きるという表現です。"},
    {t:"努力さえ（　）、必ず目標は達成できる。",o:["すれば","したなら","したとて","するだけで"],a:0,e:"「さえ〜ば」は〜だけすれば十分だという意味の条件表現です。「努力さえすれば」＝努力するという条件さえあれば。"},
    {t:"彼は怒るどころか、笑って（　）。",o:["やまなかった","しまわなかった","みせた","くれた"],a:2,e:"「笑ってみせた」は意志的にそのような行動を取ったことを強調する表現です。"},
    {t:"今回の件はご迷惑をおかけした（　）であり、深く反省しております。",o:["こと","次第","わけ","もの"],a:1,e:"「〜た次第（しだい）である」は事情・経緯を丁寧に説明する改まった表現です。"},
    {t:"社長の判断（　）、この方針が決まったわけです。",o:["として","によって","にあって","にかけて"],a:1,e:"「〜によって」は手段・原因・主体などを示す助詞です。「社長の判断によって決まった」が正しい用法です。"},
    {t:"彼女は泣きたい（　）、笑顔で見送った。",o:["に違いなく","くせして","はずが","のを抑えて"],a:3,e:"「〜のを抑えて（おさえて）」は感情・衝動を抑制してという意味です。「泣きたいのを抑えて笑顔で」は感情を我慢した状況を表します。"},
    {t:"あれほど警告した（　）、彼は同じ失敗を繰り返した。",o:["のに","ものの","としても","だけで"],a:0,e:"「〜のに」は期待・当然の結果と反する事態を表す逆接の接続助詞です。"},
    {t:"彼女の実力（　）、この程度の試験は難しくないはずだ。",o:["からして","をもって","にして","をもってすれば"],a:3,e:"「〜をもってすれば」はその能力・手段があれば、という仮定を表す高度な表現です。"},
    {t:"成功（　）失敗（　）、最後まで全力を尽くすことが大切だ。",o:["にしても／にしても","であれ／であれ","ながら／ながら","とも／とも"],a:1,e:"「〜であれ〜であれ」はどちらの場合であっても、という条件を列挙する表現です。"},
    {t:"そこまで言われる（　）もないだろうに、と彼女は思った。",o:["いわれ","道理","理由","はず"],a:0,e:"「〜いわれ（言われ）もない」はそうされる・言われる理由・道理がないという意味の慣用表現です。"},
    {t:"彼は部下の失敗を（　）、黙って見守った。",o:["知りながらも","知りつつも","知るといえども","知ったものの"],a:1,e:"「〜つつも」は〜しながらも、という逆接を表す表現です。「知りつつも見守った」は知っていながら介入しなかったことを表します。"},
    {t:"会議の結論は、予算を削減する（　）ものだった。",o:["というより","いかんによらず","にほかならない","よりほかない"],a:2,e:"「〜にほかならない」はまさに〜だ・〜以外の何ものでもない、という強い断定表現です。"},
    {t:"どんなに技術が進歩しようとも、人の心（　）変えられない問題はある。",o:["だけでは","でさえ","のみでは","をしても"],a:1,e:"「〜でさえ」は極端な例を示して「そのようなものでも」という強調を表します。「人の心でさえ変えられない」＝人の力の限界を表します。"},
    {t:"事の重大さに気づいた時には、手遅れ（　）。",o:["になってしまっていた","にもなかった","になれるはずだった","になったものだ"],a:0,e:"「〜になってしまっていた」は気づいた時点では既にその状態になっていた、という後悔・遺憾の表現です。"},
    {t:"この作品は読む（　）読むほど、深みが増す。",o:["が","に","と","ば"],a:3,e:"「読めば読むほど」は「〜ば〜ほど」の比例表現です。「読む」の条件形「読めば」と組み合わせます。"},
    {t:"規則である（　）、例外なく全員に適用される。",o:["以上は","限り","からには","上は"],a:0,e:"「〜である以上は」はその事実・立場である以上当然、という帰結表現です。"},
    {t:"彼女にとって、音楽は生きる（　）となっている。",o:["よりどころ","指針","拠点","基盤"],a:0,e:"「よりどころとなる」は精神的な支え・頼みとするものになる、という意味です。「心のよりどころ」という使い方が典型的です。"},
    {t:"締め切りに間に合わせる（　）、徹夜で作業した。",o:["ために","べく","ことで","ものの"],a:1,e:"「〜べく」は〜するために・〜しようとして、という目的を表す古風な表現です。書き言葉でよく使われます。"},
    {t:"これほどの難問、専門家（　）解けないかもしれない。",o:["でないと","さえも","のみで","だけでは"],a:1,e:"「専門家でさえも」は最も解ける可能性の高い専門家でも無理かもしれない、という極端な例の強調です。"},
    {t:"彼は昨日からずっと（　）がしている。",o:["何か嫌な予感","頭痛い気","なんとなく心配","気になること"],a:0,e:"「〜がしている」は感覚的な状態を表します。「嫌な予感がしている」は不安・胸騒ぎの感覚を表す表現です。"},
    {t:"試験範囲が広い（　）、何から勉強すれば良いかわからない。",o:["とあって","ので","だけに","せいで"],a:2,e:"「〜だけに」はそれだけの理由・それゆえに、という因果を強調する表現です。"},
    {t:"そのような発言をする（　）、彼は本当に反省しているのだろうか。",o:["くらいなら","ぐらいだから","となると","とはいうものの"],a:1,e:"「〜ぐらいだから」はその行動・状態を根拠に推測する表現です。「そんな発言をするぐらいだから（反省してないだろう）」という推測の論理です。"},
    {t:"失敗を恐れる（　）挑戦しなければ、成長はない。",o:["あまり","ゆえに","ばかりに","一方で"],a:0,e:"「〜あまり（余り）」は程度が過ぎることで、という意味。「恐れるあまり挑戦しない」＝恐れが強すぎて行動できないことを表します。"},
    {t:"彼女が何も言わなかった（　）、賛成しているわけではない。",o:["からこそ","からといって","以上","だけに"],a:1,e:"「〜からといって」は〜だからといって当然そうだとは限らない、という注意・否定の表現です。"},
    {t:"今となっては（　）、あの時もっと努力すべきだったと思う。",o:["ことだし","ことだが","ことで","ことに"],a:1,e:"「今となっては〜が」は現在の視点から過去を振り返り後悔する逆接表現の定型表現です。"},
    {t:"実力（　）、今の彼には荷が重すぎるポジションだ。",o:["なくして","からして","はともかく","はさておき"],a:2,e:"「実力はともかく（として）」は実力の問題は別にして、という意味で脇に置く表現です。"},
    {t:"そんなに心配する（　）もない。きっとうまくいくさ。",o:["こと","はず","もの","わけ"],a:0,e:"「〜することもない」はする必要・理由がない、という意味です。「心配することもない」＝心配する必要はない。"},
    {t:"彼は忙しさを（　）に、大切な連絡を怠った。",o:["言い訳","理由","口実","名目"],a:2,e:"「〜を口実（こうじつ）に」は都合のいい言い訳として利用するという意味です。「忙しさを口実にする」が慣用的表現。"},
    {t:"これほどの実績がある（　）、彼を信頼しないわけにはいかない。",o:["以上","のだから","だけに","とあれば"],a:2,e:"「〜だけに」はそれだけの根拠・理由があるからこそ、という強調表現です。実績があるからこそ信頼せざるを得ない、という文脈に合います。"},
    {t:"体調が悪い（　）無理をするな、と医者に言われた。",o:["ならでは","なのに","くせに","のだから"],a:3,e:"「〜のだから」は〜という事情・理由があるのだから、という論拠を示す表現です。「体調が悪いのだから無理をするな」が自然です。"},
    {t:"この問題を解決する（　）力が、今の私たちには求められている。",o:["に足る","だけの","ための","べき"],a:1,e:"「〜だけの力」は〜するのに十分な・必要なレベルの、という意味です。「解決するだけの力」＝解決するに必要な力。"},
    {t:"彼女は英語（　）フランス語（　）話せる。",o:["はもちろん／も","だけでなく／までも","のみならず／さえ","のみ／のみ"],a:0,e:"「〜はもちろん〜も」は言うまでもなく〜に加えて〜もという追加表現です。"},
    {t:"問題が複雑（　）、簡単には解決できない。",o:["なだけに","なので","とあれば","にして"],a:0,e:"「〜なだけに」は〜という特性・事情があるからこそ、という強調を伴う因果表現です。"},
    {t:"今回の件については、担当者に（　）説明させていただきます。",o:["おいて","かけて","よって","させて"],a:0,e:"「〜において説明させていただきます」より「担当者に説明させていただきます」＝担当者が説明するという意味の敬語表現です。ここでは「担当者に（代わって）」という意味合い。"},
    {t:"彼の努力は（　）にして、その結果はついてこなかった。",o:["甲斐なし","甲斐あり","甲斐ある","甲斐なく"],a:3,e:"「〜にして甲斐なく（かいなく）」はその努力・行為が効果を発揮できなかったという表現です。「甲斐なく」は報われない・効果がないという意味。"},
    {t:"試験が終わった（　）、全員が安堵の表情を見せた。",o:["とたんに","なり","やいなや","が最後"],a:0,e:"「〜たとたんに」はある動作が完了した瞬間すぐに次のことが起きるという表現です。"},
    {t:"どんな困難（　）立ち向かう覚悟ができている。",o:["にも","でも","とも","にして"],a:1,e:"「どんな〜でも」はいかなる〜であっても・どのような〜に対しても、という包括的な条件表現です。"},
    {t:"彼女の才能は、努力（　）輝くものだ。",o:["あっての","なくての","とあっての","によっての"],a:0,e:"「〜あっての」はそれがあってはじめて成り立つという意味。「努力あっての才能」＝努力があってこそ才能が活きる。"},

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let state = { correct:0, wrong:0, answered:0, total:0 };

function loadSection() {
  const id = document.getElementById('sectionSelect').value;
  const area = document.getElementById('questionArea');
  if (!id) {
    area.innerHTML = '<div class="empty-state">上のメニューから問題を選んでください</div>';
    document.getElementById('scoreBar').style.display = 'none';
    return;
  }
  const sec = DATA[id];
  state = { correct:0, wrong:0, answered:0, total: sec.questions.length };
  document.getElementById('scoreBar').style.display = 'flex';
  updateScore();

  let html = `<div class="section-info">📌 ${sec.name}　　${sec.desc}</div>`;
  sec.questions.forEach((q, i) => {
    const qn = i + 1;
    html += buildQuestion(id, qn, q);
  });
  area.innerHTML = html;
}

function buildQuestion(secId, qn, q) {
  const labels = ['１','２','３','４'];
  let opts = q.o.map((o,i) => `
    <label class="opt" id="opt_${secId}_${qn}_${i}" onclick="selectOpt('${secId}',${qn},${i})">
      <input type="radio" name="q_${secId}_${qn}" value="${i}">
      <span class="opt-lbl">${labels[i]}</span>${o}
    </label>`).join('');

  return `
  <div class="q-block" id="qblock_${secId}_${qn}">
    <div class="q-num">問 ${qn}</div>
    <div class="q-text">${q.t}</div>
    <div class="options">${opts}</div>
    <button class="check-btn" id="chkbtn_${secId}_${qn}" onclick="checkAnswer('${secId}',${qn})">この問題を確認する ▶</button>
    <div class="result-box" id="res_${secId}_${qn}"></div>
  </div>`;
}

function selectOpt(secId, qn, idx) {
  const sec = DATA[secId];
  const q = sec.questions[qn - 1];
  // Already answered?
  const resBox = document.getElementById(`res_${secId}_${qn}`);
  if (resBox.style.display === 'block') return;

  // Clear selection style
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt_${secId}_${qn}_${i}`);
    if (el) el.classList.remove('sel');
  }
  document.getElementById(`opt_${secId}_${qn}_${idx}`).classList.add('sel');
  document.getElementById(`chkbtn_${secId}_${qn}`).style.display = 'inline-block';
}

function checkAnswer(secId, qn) {
  const sec = DATA[secId];
  const q = sec.questions[qn - 1];
  const selected = document.querySelector(`input[name="q_${secId}_${qn}"]:checked`);
  if (!selected) return;

  const userAns = parseInt(selected.value);
  const correct = q.a;
  const isCorrect = (userAns === correct);

  // Style options
  for (let i = 0; i < q.o.length; i++) {
    const el = document.getElementById(`opt_${secId}_${qn}_${i}`);
    if (!el) continue;
    el.classList.remove('sel');
    if (i === correct) el.classList.add('ok');
    else if (i === userAns && !isCorrect) el.classList.add('ng');
    // disable
    el.style.pointerEvents = 'none';
  }

  // Disable radios
  document.querySelectorAll(`input[name="q_${secId}_${qn}"]`).forEach(r => r.disabled = true);

  // Hide button
  const btn = document.getElementById(`chkbtn_${secId}_${qn}`);
  btn.style.display = 'none';

  // Show result
  const resBox = document.getElementById(`res_${secId}_${qn}`);
  const icon = isCorrect ? '✅ 正解！' : `❌ 不正解　正解は「${q.o[correct]}」`;
  resBox.className = `result-box ${isCorrect ? 'correct-res' : 'wrong-res'}`;
  resBox.innerHTML = `<div class="result-icon">${icon}</div><div class="exp-text">💡 ${q.e}</div>`;
  resBox.style.display = 'block';

  // Update state
  state.answered++;
  if (isCorrect) state.correct++; else state.wrong++;
  updateScore();
}

function updateScore() {
  document.getElementById('scCorrect').textContent = state.correct;
  document.getElementById('scWrong').textContent = state.wrong;
  const pct = state.answered > 0 ? Math.round(state.correct / state.answered * 100) + '%' : '—';
  document.getElementById('scPct').textContent = pct;
  document.getElementById('progLbl').textContent = `${state.answered} / ${state.total} 問 回答済み`;
  document.getElementById('progFill').style.width = state.total > 0 ? `${state.answered/state.total*100}%` : '0%';
}
</script>
